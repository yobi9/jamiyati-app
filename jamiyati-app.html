<!DOCTYPE html>

<style>
:root{--brand:#10b981;--brand-dark:#059669;--brand-light:#d1fae5;--bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--danger:#ef4444;--warning:#f59e0b;--radius:16px}

body{font-family:-apple-system,'Segoe UI','Cairo',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;direction:rtl;-webkit-tap-highlight-color:transparent;font-size:14px;line-height:1.5}

.header{background:linear-gradient(135deg,#047857,#10b981);color:#fff;padding:20px;position:sticky;top:0;z-index:10}
.header h1{font-size:20px;font-weight:800}.header p{font-size:12px;opacity:.9;margin-top:2px}

.member-actions{display:flex;gap:6px;align-items:center;flex-shrink:0}

.alert-banner{background:#fef3c7;border:1px solid #fbbf24;color:#78350f;padding:10px 12px;border-radius:10px;margin-bottom:12px;font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:500px;margin:0 auto;background:#fff;border-top:1px solid var(--border);display:flex;padding:6px;padding-bottom:max(6px,env(safe-area-inset-bottom));z-index:20}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px;background:none;border:none;cursor:pointer;color:var(--muted);font-family:inherit;font-size:11px;font-weight:700;border-radius:10px}

.nav-icon{font-size:18px}
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100;backdrop-filter:blur(4px)}
.modal{background:#fff;border-radius:20px;padding:20px;max-width:400px;width:100%;max-height:90vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:800;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.modal-close{background:none;border:none;font-size:20px;color:var(--muted);cursor:pointer;padding:4px 8px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:12px 20px;border-radius:12px;z-index:200;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.2);transition:opacity .3s;max-width:90vw;text-align:center}
.toast-undo{display:flex;align-items:center;gap:12px;padding-left:8px}
.toast-undo button{background:rgba(255,255,255,.25);color:#fff;border:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-family:inherit;font-weight:700;font-size:13px}
.pin-dots{display:flex;justify-content:center;gap:20px;margin:30px 0}
.pin-dot{width:16px;height:16px;border-radius:50%;background:var(--border);transition:all .15s}
.pin-dot.filled{background:var(--brand-dark);transform:scale(1.15)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:300px;margin:0 auto}
.keypad button{height:64px;border-radius:50%;border:1px solid var(--border);background:#fff;font-size:22px;font-weight:800;font-family:inherit;cursor:pointer;transition:background .1s}
.keypad button:active{background:var(--brand-light)}
.keypad button.action{background:var(--bg);font-size:13px}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-state-icon{font-size:48px;margin-bottom:12px}
.stat-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.stat-row:last-child{border-bottom:none}
.stat-label{color:var(--muted);font-size:13px}.stat-value{font-weight:700;font-size:14px}
</style>

<body>
<div id="app"></div>
<div id="modal-root"></div>
<script>
'use strict';

/* ============ IndexedDB Layer ============ */
const DB_NAME = 'JamiyatiDB';
const DB_VERSION = 1;
const STORE = 'kv';
let idb = null;

function openIndexedDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
    };
    req.onsuccess = (e) => { idb = e.target.result; resolve(idb); };
    req.onerror = (e) => reject(e.target.error);
  });
}
function idbGet(key) {
  return new Promise((resolve, reject) => {
    const tx = idb.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbPut(key, value) {
  return new Promise((resolve, reject) => {
    const tx = idb.transaction(STORE, 'readwrite');
    const req = tx.objectStore(STORE).put(value, key);
    req.onsuccess = () => resolve(true);
    req.onerror = () => reject(req.error);
  });
}
function idbDel(key) {
  return new Promise((resolve, reject) => {
    const tx = idb.transaction(STORE, 'readwrite');
    const req = tx.objectStore(STORE).delete(key);
    req.onsuccess = () => resolve(true);
    req.onerror = () => reject(req.error);
  });
}

function idbSaveAll(data, pin) {
  return new Promise((resolve, reject) => {
    const tx = idb.transaction(STORE, 'readwrite');
    const st = tx.objectStore(STORE);
    st.put(data, 'data');
    if (pin) st.put(pin, 'pin'); else st.delete('pin');
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
}

/* ============ State ============ */
let state = {
  association: null, members: [], cycles: [], payments: [], logs: [],
  pin: null, authed: false, view: 'main', pinInput: '',
  sortBy: 'order', lastExportDate: null
};
let formState = { orderMode: 'manual' };

/* ============ Persistence ============ */
async function save() {
  try {
    await idbSaveAll({
      association: state.association,
      members: state.members,
      cycles: state.cycles,
      payments: state.payments,
      logs: state.logs,
      lastExportDate: state.lastExportDate
    }, state.pin);
    return true;
  } catch (e) {
    console.error('Save failed:', e);
    return false;
  }
}
async function load() {
  try {
    const data = await idbGet('data');
    if (data) {
      state.association = data.association || null;
      state.members = data.members || [];
      state.cycles = data.cycles || [];
      state.payments = data.payments || [];
      state.logs = data.logs || [];
      state.lastExportDate = data.lastExportDate || null;
    }
    state.pin = (await idbGet('pin')) || null;
    state.authed = !state.pin;
  } catch (e) {
    console.error('Load failed:', e);
  }
}
async function persist() {
  const ok = await save();
  if (!ok) {
    const wasAuthed = state.authed;
    await load();
    state.authed = wasAuthed;
    render();
    showToast('❌ فشل الحفظ — لم يتم التعديل');
    return false;
  }
  return true;
}

/* ============ Helpers ============ */
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function fmt(n) { return Number(n || 0).toLocaleString('en-US'); }
function money(n) {
  const c = state.association?.currency?.trim() || '';
  return fmt(n) + (c ? ' ' + c : '');
}
function uid(p) { return p + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8); }
function r2(n) { return Math.round((Number(n) || 0) * 100) / 100; }
let busy = false;
async function once(fn) {
  if (busy) return;
  busy = true;
  try { await fn(); } finally { busy = false; }
}
function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function addDays(iso, days) {
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function daysSince(iso) {
  if (!iso) return Infinity;
  const last = new Date(iso + 'T00:00:00');
  const today = new Date(todayISO() + 'T00:00:00');
  return Math.floor((today - last) / (1000 * 60 * 60 * 24));
}
const MONTHS_AR = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
function formatDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d)) return '—';
  return `${d.getDate()} ${MONTHS_AR[d.getMonth()]} ${d.getFullYear()}`;
}
// Full timestamp (when something was recorded) in local time
function formatDateTime(ts) {
  const d = new Date(ts);
  if (!ts || isNaN(d)) return '—';
  return `${d.getDate()} ${MONTHS_AR[d.getMonth()]} ${d.getFullYear()} — ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function isValidISODate(s) {
  if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  const d = new Date(s + 'T00:00:00');
  if (isNaN(d)) return false;
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}` === s;
}
// Returns an error message, or '' if the payment date is acceptable
function checkPaymentDate(date) {
  if (!isValidISODate(date)) return 'تاريخ الدفعة غير صالح';
  if (date > todayISO()) return 'لا يمكن تسجيل دفعة بتاريخ في المستقبل';
  const min = getMinPaymentDate();
  if (min && date < min) return `تاريخ الدفعة قبل بداية الجمعية (${formatDate(min)})`;
  return '';
}
// Earliest acceptable payment date: the start date, or the creation day if that came first
function getMinPaymentDate() {
  const a = state.association;
  if (!a) return '';
  const created = a.createdAt ? toLocalISO(new Date(a.createdAt)) : '';
  const start = isValidISODate(a.startDate) ? a.startDate : '';
  if (start && isValidISODate(created)) return created < start ? created : start;
  return start;
}
function toLocalISO(d) {
  if (isNaN(d)) return '';
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function showToast(msg) {
  const old = document.querySelector('.toast');
  if (old) old.remove();
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 2400);
}
function showUndoToast(msg, undoFn) {
  const old = document.querySelector('.toast');
  if (old) old.remove();
  const t = document.createElement('div');
  t.className = 'toast toast-undo';
  t.innerHTML = `<span>${esc(msg)}</span><button>تراجع</button>`;
  t.querySelector('button').onclick = () => { t.remove(); undoFn(); };
  document.body.appendChild(t);
  setTimeout(() => { if (t.parentNode) { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); } }, 3500);
}

/* ============ Financial ============ */
function getPaidCycles() { return state.cycles.filter(c => c.status === 'paid'); }
function getCurrentCycle() { return state.cycles.find(c => c.status === 'pending'); }
function getRequiredPerMember() { return state.cycles[0]?.requiredPerMember || 0; }
function getVault() {
  const inn = state.payments.reduce((s, p) => s + p.amount, 0);
  const out = getPaidCycles().reduce((s, c) => s + c.totalAmount, 0);
  return r2(inn - out);
}
function getMemberStatus(member) {
  const pc = getPaidCycles().length;
  const tc = state.cycles.length;
  const req = getRequiredPerMember();
  const tp = r2(state.payments.filter(p => p.memberId === member.id).reduce((s, p) => s + p.amount, 0));
  const need = pc >= tc ? 0 : r2(Math.max(0, (pc + 1) * req - tp));
  const credit = pc >= tc ? 0 : r2(Math.max(0, tp - (pc + 1) * req));
  return { totalPaid: tp, neededForCurrent: need, creditAfter: credit, isReady: need === 0, req };
}
function getTodayPaid(memberId) {
  const today = todayISO();
  return state.payments.filter(p => p.memberId === memberId && p.date === today).reduce((s, p) => s + p.amount, 0);
}

/* ============ Mutations ============ */
async function createAssociation(data) {
  const cd = data.collectionPeriod === 'daily' ? 1 : data.collectionPeriod === 'weekly' ? 7 : 30;
  const req = Math.floor(data.collectionAmount * (data.payoutPeriod / cd));
  if (req <= 0) { showToast('فترة الصرف صغيرة جداً'); return; }
  const members = data.members.map((m, i) => ({ id: uid('M'), name: m.name, phone: m.phone || '', order: i + 1 }));
  if (data.orderMode === 'random') {
    for (let i = members.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [members[i], members[j]] = [members[j], members[i]];
    }
  }
  members.forEach((m, i) => m.order = i + 1);
  const sorted = [...members].sort((a, b) => a.order - b.order);
  const total = req * members.length;
  const cycles = sorted.map((mem, i) => ({
    cycleIndex: i + 1,
    dueDate: addDays(data.startDate, (i + 1) * data.payoutPeriod),
    recipientMemberId: mem.id,
    requiredPerMember: req,
    totalAmount: total,
    status: 'pending',
    paidAt: null
  }));
  state.association = {
    id: uid('A'), name: data.name,
    currency: data.currency || '',
    collectionAmount: data.collectionAmount,
    collectionPeriod: data.collectionPeriod,
    collectionDays: cd,
    payoutPeriod: data.payoutPeriod,
    startDate: data.startDate,
    requiredPerMember: req,
    totalAmount: total,
    orderMode: data.orderMode,
    createdAt: new Date().toISOString(),
    status: 'active'
  };
  state.members = sorted;
  state.cycles = cycles;
  state.payments = [];
  state.logs = [{ id: uid('L'), timestamp: new Date().toISOString(), action: 'تأسيس الجمعية', details: `${data.name} - ${members.length} أعضاء - ${req} للدورة` }];
  if (!await persist()) return;
  state.view = 'main';
  render();
}

function quickPay(memberId) { return once(() => doQuickPay(memberId)); }
async function doQuickPay(memberId) {
  const m = state.members.find(x => x.id === memberId);
  if (!m) return;
  const amount = state.association.collectionAmount || getRequiredPerMember();
  state.payments.push({
    id: uid('P'), memberId, amount,
    date: todayISO(), note: 'دفعة سريعة',
    createdAt: new Date().toISOString()
  });
  state.logs.unshift({ id: uid('L'), timestamp: new Date().toISOString(), action: 'دفعة سريعة', details: `${m.name} - ${fmt(amount)}`, paymentDate: todayISO() });
  if (!await persist()) return;
  render();
  showToast(`✓ ${m.name} - ${money(amount)}`);
}

function submitPayment(memberId) { return once(() => doSubmitPayment(memberId)); }
async function doSubmitPayment(memberId) {
  const a = document.getElementById('pay-amount')?.value;
  const n = document.getElementById('pay-note')?.value || '';
  const dateEl = document.getElementById('pay-date');
  const date = dateEl ? dateEl.value : todayISO();
  if (!date) { showToast('اختر تاريخ الدفعة'); return; }
  const amount = r2(parseFloat(a));
  if (!amount || amount <= 0) { showToast('أدخل مبلغاً صحيحاً'); return; }
  const dateErr = checkPaymentDate(date);
  if (dateErr) { showToast(dateErr); return; }
  const m = state.members.find(x => x.id === memberId);
  if (!m) return;
  const same = state.payments.find(p => p.memberId === memberId && p.date === date && p.amount === amount);
  if (same && !confirm(`توجد دفعة مسجلة لـ ${m.name} بنفس المبلغ (${fmt(amount)}) ونفس التاريخ (${formatDate(date)}).\n\nهل هذه دفعة أخرى فعلاً؟\nاضغط "إلغاء" إذا كانت نفس الدفعة.`)) return;
  const now = new Date().toISOString();
  const backdated = date !== todayISO();
  state.payments.push({ id: uid('P'), memberId, amount, date, note: n, createdAt: now });
  state.logs.unshift({ id: uid('L'), timestamp: now, action: backdated ? 'دفعة بتاريخ سابق' : 'دفعة', details: `${m.name} دفع ${fmt(amount)}`, paymentDate: date });
  if (!await persist()) return;
  render();
  openPaymentModal(memberId);
  showToast('تم تسجيل الدفعة');
}

function getLastPayoutAt() {
  return getPaidCycles().reduce((mx, c) => (c.paidAt && c.paidAt > mx ? c.paidAt : mx), '');
}
// A payment recorded before the latest payout was part of the vault that paid a closed cycle
function isPaymentLocked(p) {
  const last = getLastPayoutAt();
  if (!last) return false;
  return (p.createdAt || p.date) <= last;
}
const LOCKED_REASON = 'مقفلة — سُجّلت قبل صرف دورة، فهي جزء من حساب مغلق. لتصحيح نقص سجّل دفعة إضافية.';
// Can this payment's amount become newAmount (0 = delete)?
function checkPaymentChange(paymentId, newAmount) {
  const p = state.payments.find(x => x.id === paymentId);
  if (!p) return { can: false, reason: 'الدفعة غير موجودة' };
  if (isPaymentLocked(p)) return { can: false, reason: LOCKED_REASON };
  const vaultAfter = r2(getVault() - p.amount + newAmount);
  if (vaultAfter < 0) return { can: false, reason: `مرفوض — الخزينة ستصبح بالسالب (${fmt(vaultAfter)})` };
  return { can: true };
}
function canDeletePayment(paymentId) { return checkPaymentChange(paymentId, 0); }
function canEditPayment(paymentId) {
  const p = state.payments.find(x => x.id === paymentId);
  if (!p) return { can: false, reason: 'الدفعة غير موجودة' };
  if (isPaymentLocked(p)) return { can: false, reason: LOCKED_REASON };
  return { can: true };
}

function deletePayment(paymentId) { return once(() => doDeletePayment(paymentId)); }
async function doDeletePayment(paymentId) {
  const p = state.payments.find(x => x.id === paymentId);
  if (!p) return;
  const check = canDeletePayment(paymentId);
  if (!check.can) { showToast(check.reason); return; }
  const m = state.members.find(x => x.id === p.memberId);
  const originalIndex = state.payments.findIndex(x => x.id === paymentId);
  const deletedCopy = { ...p };
  state.payments = state.payments.filter(x => x.id !== paymentId);
  state.logs.unshift({ id: uid('L'), timestamp: new Date().toISOString(), action: 'حذف دفعة', details: `${m?.name || ''} - ${fmt(p.amount)}`, paymentDate: p.date });
  if (!await persist()) return;
  closeModal();
  render();
  showUndoToast(`حُذفت دفعة ${fmt(p.amount)}`, async () => {
    state.payments.splice(originalIndex, 0, deletedCopy);
    state.logs.unshift({ id: uid('L'), timestamp: new Date().toISOString(), action: 'تراجع عن حذف', details: `${m?.name || ''} - ${fmt(deletedCopy.amount)}`, paymentDate: deletedCopy.date });
    if (await persist()) { render(); showToast('تم التراجع'); }
  });
}

function payOutCurrentCycle() { return once(doPayOutCurrentCycle); }
async function doPayOutCurrentCycle() {
  const c = getCurrentCycle();
  if (!c) return;
  if (todayISO() < c.dueDate) { showToast('لم يحل موعد الصرف'); closeModal(); return; }
  const v = getVault();
  if (v < c.totalAmount) { showToast('الخزينة لا تكفي'); closeModal(); return; }
  c.status = 'paid';
  c.paidAt = new Date().toISOString();
  const r = state.members.find(m => m.id === c.recipientMemberId);
  state.logs.unshift({ id: uid('L'), timestamp: new Date().toISOString(), action: `صرف الدورة ${c.cycleIndex}`, details: `${r?.name || '—'} - ${fmt(c.totalAmount)}` });
  if (state.cycles.every(x => x.status === 'paid')) {
    state.association.status = 'archived';
    state.logs.unshift({ id: uid('L'), timestamp: new Date().toISOString(), action: 'اكتمال الجمعية', details: 'تم صرف كل الدورات' });
  }
  if (!await persist()) return;
  closeModal();
  render();
  showToast('تم صرف الدور');
}

async function importData(input) {

  let d;
  try { d = JSON.parse(text); }

  d = sanitizeImport(d);

  }

  state.members = d.members;

  if (!await persist()) { input.value = ''; return; }
  state.view = 'main';
  render();
  showToast('تم استيراد البيانات');
  input.value = '';
}

/* Rebuilds an imported backup with clean types; returns null if anything is wrong */
function sanitizeImport(d) {
  const isObj = (x) => x && typeof x === 'object' && !Array.isArray(x);
  const str = (x) => (x == null ? '' : String(x));
  const num = (x) => { const n = Number(x); return Number.isFinite(n) ? n : NaN; };
  const isDate = (x) => typeof x === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(x);
  if (!isObj(d) || !isObj(d.association)
      || !Array.isArray(d.members) || !Array.isArray(d.cycles)
      || !Array.isArray(d.payments) || !Array.isArray(d.logs)) return null;
  const a = d.association;
  const association = {
    id: str(a.id), name: str(a.name), currency: str(a.currency).slice(0, 20),
    collectionAmount: num(a.collectionAmount),
    collectionPeriod: ['daily', 'weekly', 'monthly'].includes(a.collectionPeriod) ? a.collectionPeriod : 'daily',
    collectionDays: num(a.collectionDays), payoutPeriod: num(a.payoutPeriod),
    startDate: str(a.startDate), requiredPerMember: num(a.requiredPerMember),
    totalAmount: num(a.totalAmount), orderMode: a.orderMode === 'random' ? 'random' : 'manual',
    createdAt: str(a.createdAt), status: a.status === 'archived' ? 'archived' : 'active'
  };
  if (!association.name || !(association.collectionAmount > 0) || !isDate(association.startDate)) return null;
  const ids = new Set();
  const members = [];
  for (const m of d.members) {
    if (!isObj(m) || !m.id || ids.has(str(m.id)) || !str(m.name).trim()) return null;
    const order = num(m.order);
    if (!Number.isInteger(order)) return null;
    ids.add(str(m.id));
    const previousNames = Array.isArray(m.previousNames)
      ? m.previousNames.filter(isObj).map(x => ({ name: str(x.name), phone: str(x.phone), until: str(x.until) }))
      : [];
    members.push({ id: str(m.id), name: str(m.name), phone: str(m.phone), order, previousNames });
  }
  if (members.length < 2) return null;
  const cycles = [];
  for (const c of d.cycles) {
    if (!isObj(c) || !ids.has(str(c.recipientMemberId)) || !isDate(c.dueDate)) return null;
    const cycle = {
      cycleIndex: num(c.cycleIndex), dueDate: c.dueDate, recipientMemberId: str(c.recipientMemberId),
      requiredPerMember: num(c.requiredPerMember), totalAmount: num(c.totalAmount),
      status: c.status === 'paid' ? 'paid' : 'pending', paidAt: c.paidAt ? str(c.paidAt) : null
    };
    if (!Number.isInteger(cycle.cycleIndex) || !(cycle.requiredPerMember > 0) || !(cycle.totalAmount > 0)) return null;
    cycles.push(cycle);
  }
  if (cycles.length === 0) return null;
  const payments = [];
  for (const p of d.payments) {
    if (!isObj(p) || !ids.has(str(p.memberId)) || !isDate(p.date)) return null;
    const amount = r2(num(p.amount));
    if (!(amount > 0)) return null;
    const pay = { id: str(p.id) || uid('P'), memberId: str(p.memberId), amount, date: p.date, note: str(p.note), createdAt: str(p.createdAt) };
    if (p.editedAt) pay.editedAt = str(p.editedAt);
    if (Array.isArray(p.history)) {
      pay.history = p.history.filter(isObj).map(h => ({ amount: r2(num(h.amount)), date: isDate(h.date) ? h.date : '', note: str(h.note), editedAt: str(h.editedAt) }));
    }
    payments.push(pay);
  }
  const logs = d.logs.filter(isObj).map(l => {
    const log = { id: str(l.id) || uid('L'), timestamp: str(l.timestamp), action: str(l.action), details: str(l.details) };
    if (isDate(l.paymentDate)) log.paymentDate = l.paymentDate;
    return log;
  });
  return { association, members, cycles, payments, logs };
}

function updatePreview() {
  const amount = parseFloat(document.getElementById('form-amount')?.value) || 0;

  const pd = period === 'daily' ? 1 : period === 'weekly' ? 7 : 30;
  const req = Math.floor(amount * (payout / pd));
  if (req <= 0) { c.innerHTML = '<span style="color:#991b1b">⚠️ فترة الصرف صغيرة جداً</span>'; return; }
  const total = req * count;
  const fd = sd ? addDays(sd, payout) : '—';
  const ld = sd ? addDays(sd, payout * count) : '—';
  const hasRound = Math.floor(payout / pd) !== (payout / pd);
  const cur = (n) => fmt(n) + (currency ? ' ' + currency : '');
  c.innerHTML = `
    <div style="display:flex;justify-content:space-between;padding:4px 0"><span>قسط العضو للدورة:</span><strong>${cur(req)}</strong></div>

    ${hasRound?'<div style="margin-top:8px;font-size:11px;background:rgba(245,158,11,.2);padding:6px;border-radius:6px;color:#92400e">⚠️ تم التقريب لأسفل</div>':''}`;
}
function submitCreate() {
  const name = document.getElementById('form-name').value.trim();
  const amount = parseFloat(document.getElementById('form-amount').value);
  const period = document.getElementById('form-collection-period').value;
  const payout = parseInt(document.getElementById('form-payout-period').value);
  const sd = document.getElementById('form-start-date').value;
  const count = parseInt(document.getElementById('form-member-count').value);

  if (!name) { showToast('أدخل اسم الجمعية'); return; }

  if (!sd) { showToast('اختر تاريخ البدء'); return; }
  if (!count || count < 2) { showToast('عدد الأعضاء 2 على الأقل'); return; }
  const ni = document.querySelectorAll('.member-name');
  const pi = document.querySelectorAll('.member-phone');
  if (ni.length !== count) { showToast('عدد الأعضاء غير متطابق'); return; }
  const members = [];
  for (let i = 0; i < count; i++) {
    const n = ni[i].value.trim();
    if (!n) { showToast(`اسم العضو ${i+1} مطلوب`); return; }
    members.push({ name: n, phone: pi[i].value.trim() });
  }
  createAssociation({ name, currency, collectionAmount: amount, collectionPeriod: period, payoutPeriod: payout, startDate: sd, members, orderMode: formState.orderMode });
}

/* ============ Main Screen ============ */
function renderMainScreen() {
  const cur = getCurrentCycle();
  const v = getVault();
  const pc = getPaidCycles().length;
  const tc = state.cycles.length;
  const req = getRequiredPerMember();
  const isDone = tc > 0 && !cur;
  const today = todayISO();

  if (tc === 0) {
    return `<div class="header"><h1>${esc(state.association.name)}</h1></div>
      <div class="content"><div class="empty-state"><div class="empty-state-icon">⚠️</div><div>لا توجد دورات — البيانات قد تكون تالفة</div></div></div>`;
  }

  // Backup banner
  const daysSinceExport = daysSince(state.lastExportDate);
  const showBackupBanner = daysSinceExport >= 7;
  const backupBanner = showBackupBanner
    ? `<div class="alert-banner">
        <span>⚠️ ${state.lastExportDate ? `لم تُصدَّر منذ ${daysSinceExport} أيام` : 'لم تُصدَّر نسخة احتياطية بعد'}</span>
        <button class="btn btn-xs" style="background:#78350f;color:#fff;min-height:32px" onclick="exportData()">صدّر</button>
      </div>`
    : '';

  let hero = '';
  if (isDone) {
    hero = `<div class="hero-card" style="background:linear-gradient(135deg,#059669,#065f46)">
      <div class="hero-label">الجمعية مكتملة</div>
      <div class="hero-value">🎉</div>
      <div style="font-size:13px;opacity:.9;margin-bottom:12px">تم صرف كل الأدوار بنجاح</div>
      <button class="btn btn-block" style="background:white;color:#065f46" onclick="finishAndStartNew()">📥 أرشفة + جمعية جديدة</button>
    </div>`;
  } else {
    const r = state.members.find(m => m.id === cur.recipientMemberId);
    const isDue = today >= cur.dueDate;
    const enough = v >= cur.totalAmount;
    const canPay = isDue && enough;
    const progress = Math.min(100, Math.round((v / cur.totalAmount) * 100));
    hero = `<div class="hero-card">
      <div class="hero-label">الدورة الحالية #${esc(cur.cycleIndex)} من ${tc}</div>
      <div class="hero-value">${money(cur.totalAmount)}</div>
      <div class="progress-container"><div class="progress-fill" style="width:${progress}%"></div></div>
      <div class="progress-label"><span>تم جمع ${money(Math.min(v, cur.totalAmount))}</span><span>${progress}%</span></div>
      <div class="hero-row" style="margin-top:12px">
        <div><div class="hero-row-label">المستلم</div><div class="hero-row-value">${esc(r?.name || '—')}</div></div>
        <div style="text-align:left"><div class="hero-row-label">الاستحقاق</div><div class="hero-row-value">${formatDate(cur.dueDate)}</div></div>
      </div>
      <button class="btn btn-block" style="background:${canPay?'white':'rgba(255,255,255,.2)'};color:${canPay?'#065f46':'white'};margin-top:14px" onclick="openPayoutModal()" ${!canPay?'disabled':''}>
        ${!isDue ? `⏳ يُفعّل في ${formatDate(cur.dueDate)}` : (!enough ? `⏸️ الخزينة ناقصة ${fmt(cur.totalAmount - v)}` : '💸 صرف الدور')}
      </button>
    </div>`;
  }

  const vc = `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <div style="flex:1;min-width:0">
        <div style="font-size:12px;color:var(--muted)">الخزينة</div>
        <div style="font-size:20px;font-weight:800;color:${v>=0?'var(--brand-dark)':'var(--danger)'}">${money(v)}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px">الدورات: ${pc} / ${tc}</div>
      </div>
      ${!isDone ? `<button class="btn btn-primary" style="padding:10px 14px;font-size:13px" onclick="setView('daily')">📅 دفتر اليوم</button>` : ''}
    </div>
  </div>`;

  // Sort members
  let sortedMembers = [...state.members];
  if (state.sortBy === 'need') {
    sortedMembers.sort((a, b) => getMemberStatus(b).neededForCurrent - getMemberStatus(a).neededForCurrent);
  } else if (state.sortBy === 'name') {
    sortedMembers.sort((a, b) => a.name.localeCompare(b.name, 'ar'));
  } else {
    sortedMembers.sort((a, b) => a.order - b.order);
  }

  const quickAmount = state.association.collectionAmount || req;

  const mh = sortedMembers.map(m => {
    const s = getMemberStatus(m);
    const cnt = state.payments.filter(p => p.memberId === m.id).length;
    const todayPaid = getTodayPaid(m.id);
    const todayBadge = todayPaid > 0 ? `<span class="today-badge">✓ اليوم</span>` : '';
    let badge, bc;
    if (isDone) { badge = 'مكتمل'; bc = 'badge-success'; }
    else if (s.neededForCurrent === 0) { badge = 'جاهز'; bc = 'badge-success'; }
    else { badge = `يحتاج ${fmt(s.neededForCurrent)}`; bc = s.neededForCurrent >= req ? 'badge-danger' : 'badge-warning'; }
    const phoneRow = m.phone ? `<div style="font-size:11px;margin-top:3px;display:flex;gap:8px;flex-wrap:wrap">
      <a href="tel:${esc(m.phone)}" style="color:var(--brand-dark);text-decoration:none" onclick="event.stopPropagation()">📞 ${esc(m.phone)}</a>
      <a href="https://wa.me/${String(m.phone).replace(/[^0-9]/g, '')}" target="_blank" rel="noopener" style="color:#25d366;text-decoration:none" onclick="event.stopPropagation()">💬 واتساب</a>
    </div>` : '';
    return `<div class="member-item" onclick="openPaymentModal(${JSON.stringify(m.id).replace(/"/g,'&quot;')})">
      <div class="member-item-left">
        <div class="member-order">${esc(m.order)}</div>
        <div class="member-info">
          <div class="member-name">${esc(m.name)} ${todayBadge}</div>
          <div class="member-meta">${cnt} دفعة • مجموع ${fmt(s.totalPaid)}${s.creditAfter>0?` • رصيد +${fmt(s.creditAfter)}`:''}</div>
          ${phoneRow}
        </div>
      </div>
      <div class="member-actions">
        <span class="badge ${bc}">${badge}</span>
        ${!isDone ? `<button class="btn btn-primary btn-xs" onclick="event.stopPropagation();quickPay(${JSON.stringify(m.id).replace(/"/g,'&quot;')})">+${fmt(quickAmount)}</button>` : ''}
      </div>
    </div>`;
  }).join('');

  return `<div class="header"><h1>${esc(state.association.name)}</h1><p>${state.members.length} عضو • قسط الدورة ${money(req)}</p></div>
    <div class="content">
      ${backupBanner}
      ${hero}
      ${vc}
      <div class="card">
        <h2 class="card-title"><span>الأعضاء</span><span style="font-size:12px;color:var(--muted);font-weight:400">${state.members.length}</span></h2>
        <div class="sort-tabs">
          <button class="sort-tab ${state.sortBy==='order'?'active':''}" onclick="setSort('order')">الدور</button>
          <button class="sort-tab ${state.sortBy==='need'?'active':''}" onclick="setSort('need')">الحاجة</button>
          <button class="sort-tab ${state.sortBy==='name'?'active':''}" onclick="setSort('name')">الاسم</button>
        </div>
        ${mh}
      </div>
    </div>`;
}

/* ============ Daily Register ============ */
function renderDailyScreen() {
  const cur = getCurrentCycle();
  if (!cur) {
    return `<div class="header"><h1>📅 دفتر اليوم</h1></div>
      <div class="content">
        <div class="empty-state">
          <div class="empty-state-icon">🎉</div>
          <div>الجمعية مكتملة أو لا توجد دورة نشطة</div>
          <button class="btn btn-primary btn-block" onclick="setView('main')" style="margin-top:16px">← الرئيسية</button>
        </div>
      </div>`;
  }
  const today = todayISO();
  const amount = state.association.collectionAmount || getRequiredPerMember();
  const totalMembers = state.members.length;
  const data = state.members.map(m => ({
    m,
    todayPaid: getTodayPaid(m.id),
    isPaid: getTodayPaid(m.id) > 0
  }));
  const paidCount = data.filter(x => x.isPaid).length;
  const todayTotal = data.reduce((s, x) => s + x.todayPaid, 0);
  const rows = data.map(({ m, todayPaid, isPaid }) => `
    <div class="daily-row ${isPaid ? 'paid' : ''}">
      <div class="daily-row-info">
        <div class="daily-row-name">${esc(m.name)}</div>
        <div class="daily-row-status">${isPaid ? `✅ دفع اليوم: ${money(todayPaid)}` : '⬜ لم يدفع اليوم'}</div>
      </div>
      ${isPaid
        ? `<span class="badge badge-success">تم</span>`
        : `<button class="btn btn-primary btn-sm" onclick="quickPay(${JSON.stringify(m.id).replace(/"/g,'&quot;')})">+ ${fmt(amount)}</button>`
      }

  `).join('');
  return `<div class="header">
    <h1>📅 دفتر اليوم</h1>
    <p>${formatDate(today)} • ${paidCount}/${totalMembers} دفعوا</p>
  </div>
  <div class="content">
    <div class="card" style="background:linear-gradient(135deg,#059669,#10b981);color:#fff;padding:14px;margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><div style="font-size:12px;opacity:.9">تقدم اليوم</div>

      </div>
    </div>
    ${rows}
    <button class="btn btn-outline btn-block" onclick="setView('main')" style="margin-top:8px">← العودة للرئيسية</button>
  </div>`;
}

/* ============ Payment row (member modal + history) ============ */
function renderPaymentRow(p, from, showMember) {
  const idArg = JSON.stringify(p.id).replace(/"/g,'&quot;');
  const fromArg = JSON.stringify(from).replace(/"/g,'&quot;');
  const edit = canEditPayment(p.id);
  const del = canDeletePayment(p.id);
  let btns;
  if (!edit.can) {
    btns = `<button class="btn btn-outline btn-xs" onclick="showToast(${JSON.stringify(edit.reason).replace(/"/g,'&quot;')})" title="مقفل" style="opacity:.55">🔒</button>`;
  } else {
    btns = `<button class="btn btn-outline btn-xs" onclick="openEditPaymentModal(${idArg}, ${fromArg})" title="تعديل">✏️</button>`
      + (del.can
        ? `<button class="btn btn-danger btn-xs" onclick="deletePayment(${idArg})" title="حذف">🗑</button>`
        : `<button class="btn btn-outline btn-xs" onclick="showToast(${JSON.stringify(del.reason).replace(/"/g,'&quot;')})" title="لا يمكن الحذف" style="opacity:.55">🗑</button>`);
  }
  const who = showMember ? `${esc(state.members.find(m => m.id === p.memberId)?.name || '—')} — ` : '';
  return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px;background:var(--bg);border-radius:8px;margin-bottom:6px;font-size:12px;gap:8px">
    <div style="flex:1;min-width:0">
      <div style="font-weight:700">${who}${fmt(p.amount)} <span style="color:var(--muted);font-weight:400;font-size:11px">— 📅 ${formatDate(p.date)}</span></div>
      <div style="color:var(--muted);font-size:10px;margin-top:2px">🕒 سُجّلت: ${formatDateTime(p.createdAt)}${p.editedAt ? ` • ✏️ عُدّلت: ${formatDateTime(p.editedAt)}` : ''}</div>
      ${p.note?`<div style="color:var(--muted);font-size:11px;margin-top:2px">${esc(p.note)}</div>`:''}
    </div>
    <div style="display:flex;gap:4px;flex-shrink:0">${btns}</div>
  </div>`;
}

/* ============ History Screen ============ */
function renderHistoryScreen() {
  const pc = getPaidCycles();
  const tp = state.payments.reduce((s, p) => s + p.amount, 0);

  const ch = pc.length === 0
    ? '<div class="empty-state"><div class="empty-state-icon">📋</div><div>لا توجد دورات مصروفة بعد</div></div>'
    : pc.map(c => {
        const r = state.members.find(m => m.id === c.recipientMemberId);
        return `<div style="padding:10px;background:var(--bg);border-radius:10px;margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;margin-bottom:4px"><strong>الدورة ${esc(c.cycleIndex)}</strong><span class="badge badge-success">مصروفة</span></div>
          <div style="font-size:12px;color:var(--muted)">المستلم: ${esc(r?.name || '—')}</div>
          <div style="font-size:12px;margin-top:4px">المبلغ: <strong>${money(c.totalAmount)}</strong></div>
          <div style="font-size:11px;color:var(--muted);margin-top:4px">تاريخ الصرف: ${formatDate(c.paidAt?.split('T')[0])}</div>

    <div style="display:flex;justify-content:space-between;gap:8px"><strong>${esc(l.action)}</strong><span style="color:var(--muted);font-size:11px;white-space:nowrap">🕒 ${formatDateTime(l.timestamp)}</span></div>
    <div style="color:var(--muted);margin-top:2px">${esc(l.details)}</div>
    ${l.paymentDate ? `<div style="color:var(--muted);margin-top:2px;font-size:11px">📅 تاريخ الدفعة: ${formatDate(l.paymentDate)}</div>` : ''}

  const allPays = state.payments.slice().sort(comparePaymentsDesc);

    ? '<div style="color:var(--muted);font-size:13px">لا توجد دفعات</div>'

  return `<div class="header"><h1>السجل</h1><p>سجل الدورات والحركات</p></div>
    <div class="content">
      <div class="card"><h2 class="card-title">الإحصائيات</h2>
        <div class="stat-row"><span class="stat-label">إجمالي التحصيل</span><span class="stat-value">${money(tp)}</span></div>
        <div class="stat-row"><span class="stat-label">إجمالي المصروف</span><span class="stat-value">${money(po)}</span></div>
        <div class="stat-row"><span class="stat-label">الدورات</span><span class="stat-value">${pc.length} / ${state.cycles.length}</span></div>
      </div>
      <div class="card"><h2 class="card-title">الدورات المصروفة</h2>${ch}</div>
      <div class="card"><h2 class="card-title"><span>الدفعات</span><span style="font-size:11px;color:var(--muted);font-weight:400">📅 تاريخ الدفعة • 🕒 وقت التسجيل</span></h2>${ph}</div>
      <div class="card"><h2 class="card-title">سجل الحركات</h2>${lh || '<div style="color:var(--muted);font-size:13px">لا توجد حركات</div>'}</div>

/* ============ Modals ============ */
function openModal(html) {
  document.getElementById('modal-root').innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
}
function closeModal() { document.getElementById('modal-root').innerHTML = ''; }
function setPayAmount(n) {
  const el = document.getElementById('pay-amount');
  if (el) { el.value = n; el.focus(); }
}

function openPaymentModal(memberId) {
  const m = state.members.find(x => x.id === memberId);
  if (!m) return;
  const s = getMemberStatus(m);
  const pc = getPaidCycles().length;
  const mp = state.payments.filter(p => p.memberId === memberId).slice().sort(comparePaymentsDesc);
  const quickAmount = state.association.collectionAmount || s.req;
  const payList = mp.length === 0
    ? '<div style="text-align:center;color:var(--muted);padding:12px;font-size:12px">لا توجد دفعات بعد</div>'
    : mp.map(p => renderPaymentRow(p, 'member', false)).join('');
  const lockNote = pc > 0
    ? '<div style="background:#fef3c7;padding:8px;border-radius:8px;font-size:11px;color:#92400e;margin-top:8px">💡 الدفعات التي سُجّلت قبل آخر صرف (🔒) لا تُعدّل ولا تُحذف لحماية الحسابات المغلقة. لتصحيح نقص فيها سجّل دفعة إضافية.</div>'
    : '';
  const phoneRow = m.phone ? `<div style="display:flex;gap:8px;margin-bottom:10px;font-size:12px">
    <a href="tel:${esc(m.phone)}" class="btn btn-outline btn-xs" style="flex:1;text-decoration:none">📞 اتصال</a>
    <a href="https://wa.me/${String(m.phone).replace(/[^0-9]/g, '')}" target="_blank" rel="noopener" class="btn btn-outline btn-xs" style="flex:1;text-decoration:none;color:#25d366">💬 واتساب</a>
  </div>` : '';
  openModal(`
    <div class="modal-title"><span>📋 دفعات ${esc(m.name)}</span><button class="modal-close" onclick="closeModal()">×</button></div>
    <button class="btn btn-outline btn-block btn-sm" style="margin-bottom:10px" onclick="openEditMemberModal(${JSON.stringify(memberId).replace(/"/g,'&quot;')})">✏️ تعديل بيانات العضو أو دوره</button>
    <div style="background:var(--brand-light);padding:10px;border-radius:10px;margin-bottom:12px;font-size:12px;color:#065f46">
      <div style="display:flex;justify-content:space-between;margin-bottom:4px"><span>مجموع المدفوع:</span><strong>${money(s.totalPaid)}</strong></div>
      <div style="display:flex;justify-content:space-between"><span>الحالة:</span><strong>${s.neededForCurrent===0?'✅ جاهز للدورة':'يحتاج: '+fmt(s.neededForCurrent)}</strong></div>
    </div>
    ${phoneRow}
    <div class="field"><label class="label">➕ إضافة دفعة</label>
      <div class="quick-amounts">
        <button onclick="setPayAmount(${Number(quickAmount)})">${fmt(quickAmount)}</button>
        <button onclick="setPayAmount(${Number(quickAmount) * 2})">${fmt(quickAmount * 2)}</button>
        ${s.neededForCurrent > 0 && s.neededForCurrent !== quickAmount ? `<button onclick="setPayAmount(${Number(s.neededForCurrent)})">المتبقي (${fmt(s.neededForCurrent)})</button>` : ''}
      </div>
      <input type="number" class="input" id="pay-amount" placeholder="0" min="1" value="${Number(s.neededForCurrent)||''}">
    </div>
    <div class="row">
      <div class="field"><label class="label">📅 تاريخ الدفعة</label><input type="date" class="input" id="pay-date" value="${todayISO()}" max="${todayISO()}" min="${esc(getMinPaymentDate())}"></div>
      <div class="field"><label class="label">ملاحظة</label><input type="text" class="input" id="pay-note" placeholder="اختياري"></div>
    </div>
    <button class="btn btn-primary btn-block" onclick="submitPayment(${JSON.stringify(memberId).replace(/"/g,'&quot;')})">+ تسجيل الدفعة</button>
    <div style="border-top:1px solid var(--border);padding-top:12px;margin-top:12px">
      <div style="font-size:12px;font-weight:700;margin-bottom:8px;color:var(--muted)">📜 سجل الدفعات (${mp.length})</div>
      ${payList}
      ${lockNote}
    </div>
    <button class="btn btn-outline btn-block" onclick="closeModal()" style="margin-top:12px">إغلاق</button>
  `);
  setTimeout(() => document.getElementById('pay-amount')?.focus(), 100);
}

/* ============ Edit Payment ============ */
function comparePaymentsDesc(a, b) {
  if (a.date !== b.date) return a.date < b.date ? 1 : -1;
  return (a.createdAt || '') < (b.createdAt || '') ? 1 : -1;
}
let pendingEdit = null;

function openEditPaymentModal(paymentId, from, draft) {
  const p = state.payments.find(x => x.id === paymentId);
  if (!p) return;
  const check = canEditPayment(paymentId);
  if (!check.can) { showToast(check.reason); return; }
  const m = state.members.find(x => x.id === p.memberId);
  const v = draft || { amount: p.amount, date: p.date, note: p.note || '' };
  const idArg = JSON.stringify(paymentId).replace(/"/g,'&quot;');
  const fromArg = JSON.stringify(from).replace(/"/g,'&quot;');
  openModal(`
    <div class="modal-title"><span>✏️ تعديل دفعة — ${esc(m?.name || '—')}</span><button class="modal-close" onclick="closeEditPayment(${fromArg}, ${JSON.stringify(p.memberId).replace(/"/g,'&quot;')})">×</button></div>
    <div style="background:var(--bg);padding:10px;border-radius:10px;margin-bottom:12px;font-size:12px">
      الدفعة الحالية: <strong>${money(p.amount)}</strong> بتاريخ <strong>${formatDate(p.date)}</strong><br>
      <span style="color:var(--muted);font-size:11px">🕒 سُجّلت: ${formatDateTime(p.createdAt)}</span>
    </div>
    <div class="field"><label class="label">المبلغ الصحيح *</label><input type="number" class="input" id="edit-pay-amount" min="1" value="${Number(v.amount)}"></div>
    <div class="field"><label class="label">📅 تاريخ الدفعة الصحيح *</label><input type="date" class="input" id="edit-pay-date" value="${esc(v.date)}" max="${todayISO()}" min="${esc(getMinPaymentDate())}"></div>
    <div class="field"><label class="label">ملاحظة</label><input type="text" class="input" id="edit-pay-note" value="${esc(v.note)}"></div>
    <div class="row" style="margin-top:12px">
      <button class="btn btn-outline" onclick="closeEditPayment(${fromArg}, ${JSON.stringify(p.memberId).replace(/"/g,'&quot;')})" style="flex:1">إلغاء</button>
      <button class="btn btn-primary" onclick="reviewPaymentEdit(${idArg}, ${fromArg})" style="flex:2">متابعة ←</button>
    </div>
  `);
}

function closeEditPayment(from, memberId) {
  pendingEdit = null;
  if (from === 'member') openPaymentModal(memberId); else closeModal();
}

function reviewPaymentEdit(paymentId, from) {
  const p = state.payments.find(x => x.id === paymentId);
  if (!p) return;
  const amount = r2(parseFloat(document.getElementById('edit-pay-amount')?.value));
  const date = document.getElementById('edit-pay-date')?.value || '';
  if (!date) { showToast('اختر تاريخ الدفعة'); return; }
  const note = document.getElementById('edit-pay-note')?.value.trim() || '';
  if (!amount || amount <= 0) { showToast('أدخل مبلغاً صحيحاً — لحذف الدفعة استخدم زر 🗑'); return; }
  const dateErr = checkPaymentDate(date);
  if (dateErr) { showToast(dateErr); return; }
  if (amount === p.amount && date === p.date && note === (p.note || '')) { showToast('لم تغيّر شيئاً'); return; }
  const check = checkPaymentChange(paymentId, amount);
  if (!check.can) { showToast(check.reason); return; }

  pendingEdit = { paymentId, from, amount, date, note };
  const m = state.members.find(x => x.id === p.memberId);
  const before = getMemberStatus(m);
  const diff = r2(amount - p.amount);
  const vault = getVault();
  const rowStyle = 'display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:6px 0;border-bottom:1px solid var(--border);align-items:center';
  const changed = (a, b) => a !== b ? 'color:var(--brand-dark);font-weight:800' : 'color:var(--muted)';
  const idArg = JSON.stringify(paymentId).replace(/"/g,'&quot;');
  const fromArg = JSON.stringify(from).replace(/"/g,'&quot;');
  const totalAfter = r2(before.totalPaid + diff);
  openModal(`
    <div class="modal-title"><span>تأكيد تعديل الدفعة</span></div>
    <div style="font-size:12px;margin-bottom:8px">العضو: <strong>${esc(m?.name || '—')}</strong></div>
    <div style="font-size:12px;background:var(--bg);padding:10px;border-radius:10px">
      <div style="${rowStyle};font-weight:700;color:var(--muted)"><span></span><span>قبل</span><span>بعد</span></div>
      <div style="${rowStyle}"><span>المبلغ</span><span>${fmt(p.amount)}</span><span style="${changed(amount, p.amount)}">${fmt(amount)}</span></div>
      <div style="${rowStyle}"><span>التاريخ</span><span>${formatDate(p.date)}</span><span style="${changed(date, p.date)}">${formatDate(date)}</span></div>
      ${note !== (p.note || '') ? `<div style="${rowStyle}"><span>الملاحظة</span><span>${esc(p.note || '—')}</span><span style="color:var(--brand-dark);font-weight:800">${esc(note || '—')}</span></div>` : ''}
      <div style="${rowStyle}"><span>مجموع ما دفعه العضو</span><span>${fmt(before.totalPaid)}</span><span style="${changed(totalAfter, before.totalPaid)}">${fmt(totalAfter)}</span></div>
      <div style="${rowStyle};border-bottom:none"><span>الخزينة</span><span>${fmt(vault)}</span><span style="${changed(r2(vault + diff), vault)}">${fmt(r2(vault + diff))}</span></div>
    </div>
    <div style="font-size:11px;color:var(--muted);margin-top:8px">سيُسجَّل هذا التعديل في سجل الحركات مع القيم القديمة والجديدة ووقت التعديل.</div>
    <div class="row" style="margin-top:12px">
      <button class="btn btn-outline" onclick="backToPaymentEdit()" style="flex:1">→ رجوع</button>
      <button class="btn btn-primary" id="confirm-edit-btn" onclick="confirmPaymentEdit()" style="flex:2">✓ تأكيد الحفظ</button>
    </div>
  `);
}

function backToPaymentEdit() {
  if (!pendingEdit) { closeModal(); return; }
  const { paymentId, from, amount, date, note } = pendingEdit;
  openEditPaymentModal(paymentId, from, { amount, date, note });
}

function confirmPaymentEdit() { return once(doConfirmPaymentEdit); }
async function doConfirmPaymentEdit() {
  const e = pendingEdit;
  if (!e) return;
  const p = state.payments.find(x => x.id === e.paymentId);
  if (!p) { pendingEdit = null; closeModal(); showToast('الدفعة غير موجودة'); return; }
  // Re-check against the current data in case anything changed since the review screen
  const dateErr = checkPaymentDate(e.date);
  if (dateErr) { showToast(dateErr); return; }
  const check = checkPaymentChange(p.id, e.amount);
  if (!check.can) { showToast(check.reason); return; }

  const m = state.members.find(x => x.id === p.memberId);
  const now = new Date().toISOString();
  const parts = [];
  if (e.amount !== p.amount) parts.push(`المبلغ ${fmt(p.amount)} ← ${fmt(e.amount)}`);
  if (e.date !== p.date) parts.push(`التاريخ ${formatDate(p.date)} ← ${formatDate(e.date)}`);
  if (e.note !== (p.note || '')) parts.push(`الملاحظة «${p.note || '—'}» ← «${e.note || '—'}»`);
  p.history = [...(p.history || []), { amount: p.amount, date: p.date, note: p.note || '', editedAt: now }];
  p.amount = e.amount;
  p.date = e.date;
  p.note = e.note;
  p.editedAt = now;
  state.logs.unshift({ id: uid('L'), timestamp: now, action: 'تعديل دفعة', details: `${m?.name || ''}: ${parts.join('، ')}`, paymentDate: e.date });
  pendingEdit = null;
  if (!await persist()) { closeModal(); return; }
  render();
  if (e.from === 'member') openPaymentModal(p.memberId); else closeModal();
  showToast('تم حفظ تعديل الدفعة');
}

/* ============ Edit Member ============ */
function openEditMemberModal(memberId) {
  const m = state.members.find(x => x.id === memberId);
  if (!m) return;
  const myCycle = state.cycles.find(c => c.recipientMemberId === memberId);
  const received = myCycle?.status === 'paid';
  const idArg = JSON.stringify(memberId).replace(/"/g,'&quot;');
  const orderField = received
    ? `<div style="font-size:12px;color:var(--muted);background:var(--bg);padding:8px;border-radius:8px">استلم هذا العضو دوره (الدورة ${esc(myCycle.cycleIndex)}) — لا يمكن تغيير دوره.</div>`
    : `<select class="select" id="edit-order">${state.cycles
        .filter(c => c.status === 'pending')
        .sort((a, b) => a.cycleIndex - b.cycleIndex)
        .map(c => {
          const r = state.members.find(x => x.id === c.recipientMemberId);
          const label = c.recipientMemberId === memberId ? '(دوره الحالي)' : `مكان ${esc(r?.name || '—')}`;
          return `<option value="${Number(c.cycleIndex)}" ${c.recipientMemberId === memberId ? 'selected' : ''}>الدور ${esc(c.cycleIndex)} — ${formatDate(c.dueDate)} ${label}</option>`;
        }).join('')}</select>
       <div style="font-size:11px;color:var(--muted);margin-top:4px">عند اختيار دور آخر يتبادل العضوان الدورين.</div>`;
  const replaceField = received
    ? ''
    : `<label style="display:flex;gap:8px;align-items:flex-start;font-size:13px;background:#fef3c7;padding:10px;border-radius:10px;cursor:pointer">
        <input type="checkbox" id="edit-replace" style="margin-top:3px">
        <span>هذا <strong>عضو جديد</strong> يحل محل عضو انسحب.<br><span style="font-size:11px;color:#92400e">يأخذ العضو الجديد نفس الدور ونفس الرصيد المدفوع (${money(getMemberStatus(m).totalPaid)}). تسوية هذا المبلغ مع العضو المنسحب تتم بينكم خارج التطبيق.</span></span>
      </label>`;
  openModal(`
    <div class="modal-title"><span>✏️ تعديل العضو</span><button class="modal-close" onclick="openPaymentModal(${idArg})">×</button></div>
    <div class="field"><label class="label">الاسم *</label><input type="text" class="input" id="edit-name" value="${esc(m.name)}"></div>
    <div class="field"><label class="label">الهاتف (اختياري)</label><input type="tel" class="input" id="edit-phone" value="${esc(m.phone)}"></div>
    <div class="field"><label class="label">الدور</label>${orderField}</div>
    ${replaceField}
    <div class="row" style="margin-top:12px">
      <button class="btn btn-outline" onclick="openPaymentModal(${idArg})" style="flex:1">إلغاء</button>
      <button class="btn btn-primary" onclick="saveMember(${idArg})" style="flex:2">حفظ</button>
    </div>
  `);
}

function saveMember(memberId) { return once(() => doSaveMember(memberId)); }
async function doSaveMember(memberId) {
  const m = state.members.find(x => x.id === memberId);
  if (!m) return;
  const name = document.getElementById('edit-name')?.value.trim() || '';
  const phone = document.getElementById('edit-phone')?.value.trim() || '';
  const newIndex = parseInt(document.getElementById('edit-order')?.value);
  const isReplace = !!document.getElementById('edit-replace')?.checked;
  if (!name) { showToast('أدخل اسم العضو'); return; }

  const myCycle = state.cycles.find(c => c.recipientMemberId === memberId);
  const target = Number.isInteger(newIndex) ? state.cycles.find(c => c.cycleIndex === newIndex) : null;
  const swap = target && myCycle && target !== myCycle;
  if (swap && (myCycle.status !== 'pending' || target.status !== 'pending')) { showToast('لا يمكن تغيير دور تم صرفه'); return; }

  const oldName = m.name;
  const changed = name !== m.name || phone !== m.phone || swap;
  if (!changed) { openPaymentModal(memberId); return; }

  const now = new Date().toISOString();
  if (isReplace) {
    m.previousNames = [...(m.previousNames || []), { name: m.name, phone: m.phone, until: now }];
    state.logs.unshift({ id: uid('L'), timestamp: now, action: 'استبدال عضو', details: `${oldName} ← ${name} (الدور ${myCycle?.cycleIndex ?? '—'})` });
  } else if (name !== m.name || phone !== m.phone) {
    state.logs.unshift({ id: uid('L'), timestamp: now, action: 'تعديل عضو', details: name !== oldName ? `${oldName} ← ${name}` : `${name} - تغيير الهاتف` });
  }
  m.name = name;
  m.phone = phone;

  if (swap) {
    const other = state.members.find(x => x.id === target.recipientMemberId);
    target.recipientMemberId = m.id;
    myCycle.recipientMemberId = other.id;
    m.order = target.cycleIndex;
    other.order = myCycle.cycleIndex;
    state.logs.unshift({ id: uid('L'), timestamp: now, action: 'تغيير الدور', details: `${m.name} ↔ ${other.name} (الدور ${target.cycleIndex} و ${myCycle.cycleIndex})` });
  }

  if (!await persist()) return;
  render();
  openPaymentModal(memberId);
  showToast('تم حفظ التعديل');
}

function openPayoutModal() {
  const c = getCurrentCycle();
  if (!c) { showToast('لا توجد دورة حالية'); return; }
  if (todayISO() < c.dueDate) { showToast('لم يحل موعد الصرف'); return; }
  const v = getVault();
  if (v < c.totalAmount) { showToast(`الخزينة ناقصة ${fmt(c.totalAmount - v)}`); return; }
  const r = state.members.find(m => m.id === c.recipientMemberId);
  openModal(`
    <div class="modal-title"><span>صرف الدورة #${esc(c.cycleIndex)}</span><button class="modal-close" onclick="closeModal()">×</button></div>
    <div style="background:var(--bg);padding:12px;border-radius:12px;margin-bottom:12px;font-size:13px">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px"><span>المستلم:</span><strong>${esc(r?.name || '—')}</strong></div>
      <div style="display:flex;justify-content:space-between;margin-bottom:6px"><span>المبلغ:</span><strong style="color:var(--brand-dark)">${money(c.totalAmount)}</strong></div>
      <div style="display:flex;justify-content:space-between"><span>الخزينة بعد الصرف:</span><strong>${money(v - c.totalAmount)}</strong></div>
    </div>
    <div class="row">
      <button class="btn btn-outline" onclick="closeModal()" style="flex:1">إلغاء</button>
      <button class="btn btn-primary" onclick="payOutCurrentCycle()" style="flex:2">تأكيد الصرف</button>
    </div>
  `);
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

/* ============ Init ============ */
async function init() {
  // Ask the browser not to auto-delete our data when the device is low on space
  try { if (navigator.storage?.persist) await navigator.storage.persist(); } catch (e) { console.warn(e); }
  document.getElementById('app').innerHTML = '<div style="padding:60px;text-align:center;color:#64748b"><div style="font-size:32px;margin-bottom:12px">📒</div><div>جارٍ التحميل...</div></div>';
  try {
    await openIndexedDB();
    await load();
    render();
  } catch (e) {
    console.error(e);
    document.getElementById('app').innerHTML = '<div style="padding:40px;text-align:center;color:#ef4444;font-family:sans-serif"><h2>فشل فتح التطبيق</h2><p style="margin-top:10px;color:#64748b">تحقق من إعدادات المتصفح وأعد التحميل.</p></div>';
  }
}
init();
</script>
</body>
</html>
